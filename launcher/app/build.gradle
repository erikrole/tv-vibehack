plugins {
    id 'com.android.application'
}

// Home Assistant settings live in launcher/local.properties (gitignored): ha.url and ha.token.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
def q = { String v -> '"' + v.replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
        buildConfigField 'String', 'HA_URL', q(localProps.getProperty('ha.url', ''))
        buildConfigField 'String', 'HA_TOKEN', q(localProps.getProperty('ha.token', ''))
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        // The launcher is sideloaded over ADB, never published to Google Play, so Play's minimum targetSdk
        // does not apply; without this, lintVitalRelease fails assembleRelease.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
